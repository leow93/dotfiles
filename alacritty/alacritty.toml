general.import = ["~/.config/alacritty/themes/dracula.toml"]

# "~/.config/alacritty/key-bindings.toml", 
# "~/.config/alacritty/themes/rose-pine.toml"
[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"


[terminal]
shell = "/opt/homebrew/bin/fish"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "3"
mods = "Alt"
chars = "#"

[window]
option_as_alt = "Both" # Or "OnlyLeft" / "OnlyRight"
